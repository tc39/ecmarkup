<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<link rel="canonical" href="../#sec-new-name">
<script>
(function () {
  if (window.navigating) return;
  var target = 'new-name.html';
  var hash = location.hash;
  if (hash && typeof idToSection !== 'undefined') {
    var id = hash.substring(1);
    var section = idToSection[id];
    if (section == null) {
      try {
        section = idToSection[decodeURIComponent(id)];
      } catch (e) {}
    }
    if (section != null) {
      target = section === 'index' ? './' : section + '.html';
    }
  }
  location.replace(target + hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=new-name.html"></noscript>
</head>
<body>
<p>This page has moved to <a href="new-name.html">new-name.html</a>.</p>
</body>
</html>
